<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Fitness Tracker</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="container">
        <!-- Weekly Progress -->

<div class="weekly-section">

    <h2>Weekly Progress</h2>

    <div class="week">

        <div class="day">
            <span>Mon</span>
            <div class="week-bar">
                <div class="week-fill" id="mon"></div>
            </div>
        </div>

        <div class="day">
            <span>Tue</span>
            <div class="week-bar">
                <div class="week-fill" id="tue"></div>
            </div>
        </div>

        <div class="day">
            <span>Wed</span>
            <div class="week-bar">
                <div class="week-fill" id="wed"></div>
            </div>
        </div>

        <div class="day">
            <span>Thu</span>
            <div class="week-bar">
                <div class="week-fill" id="thu"></div>
            </div>
        </div>

        <div class="day">
            <span>Fri</span>
            <div class="week-bar">
                <div class="week-fill" id="fri"></div>
            </div>
        </div>

        <div class="day">
            <span>Sat</span>
            <div class="week-bar">
                <div class="week-fill" id="sat"></div>
            </div>
        </div>

        <div class="day">
            <span>Sun</span>
            <div class="week-bar">
                <div class="week-fill" id="sun"></div>
            </div>
        </div>

    </div>

</div>

        <h1>Fitness Tracker</h1>


        <!-- Dashboard -->

        <div class="dashboard">

            <div class="card">

                <h3>Steps</h3>

                <p id="stepsDisplay">0</p>

            </div>


            <div class="card">

                <h3>Workout</h3>

                <p id="workoutDisplay">
                    0 min
                </p>

            </div>


            <div class="card">

                <h3>Calories</h3>

                <p id="caloriesDisplay">
                    0 kcal
                </p>

            </div>

        </div>



        <!-- Add Fitness Data -->

        <div class="form-section">

            <h2>Add Fitness Data</h2>


            <label for="steps">
                Steps:
            </label>

            <input
                type="number"
                id="steps"
                placeholder="Enter steps"
            >


            <label for="workout">
                Workout Time (minutes):
            </label>

            <input
                type="number"
                id="workout"
                placeholder="Enter workout time"
            >


            <label for="calories">
                Calories Burned:
            </label>

            <input
                type="number"
                id="calories"
                placeholder="Enter calories"
            >


            <button onclick="addFitnessData()">
                Add Data
            </button>

        </div>



        <!-- Progress -->

        <div class="progress-section">

            <h2>Today's Progress</h2>


            <p>Steps Goal</p>

            <div class="progress-bar">

                <div id="stepsProgress"></div>

            </div>


            <p>Workout Goal</p>

            <div class="progress-bar">

                <div id="workoutProgress"></div>

            </div>


            <p>Calories Goal</p>

            <div class="progress-bar">

                <div id="caloriesProgress"></div>

            </div>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
